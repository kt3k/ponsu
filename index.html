<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>位数 2・3・4 のモノイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e2ddd3;
  --accent: #b4432c;
  --c0: #f1efe9; --c1: #f6c9a8; --c2: #a8d5c2; --c3: #b9c4ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513; --card: #201f1c; --ink: #ece8e0; --muted: #a29c90; --line: #35332e;
    --accent: #ec8a6f;
    --c0: #2a2925; --c1: #6b4128; --c2: #275545; --c3: #343f6e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.6; }
header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 48px; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 8px; letter-spacing: .02em; }
.lead { color: var(--muted); margin: 0 0 24px; max-width: 46em; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
nav button, .filters label {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
nav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; font-size: .9rem; }
.filters label { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; }
section h2 { font-size: 1.3rem; margin: 32px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
section h2 small { color: var(--muted); font-weight: 400; font-size: .9rem; margin-left: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card h3 { margin: 0 0 8px; font-size: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
.card h3 > span { color: var(--muted); font-weight: 400; font-size: .8rem; }
table { border-collapse: collapse; font-family: "IBM Plex Mono", ui-monospace, monospace; margin: 0 auto 10px; }
td, th { width: 2.1em; height: 2.1em; text-align: center; font-size: .95rem; }
th { color: var(--muted); font-weight: 500; }
thead th { border-bottom: 1px solid var(--muted); }
tbody th { border-right: 1px solid var(--muted); }
td.v0 { background: var(--c0); } td.v1 { background: var(--c1); }
td.v2 { background: var(--c2); } td.v3 { background: var(--c3); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.tag { font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
.tag.g { border-color: var(--accent); color: var(--accent); }
dl { margin: 0; font-size: .78rem; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 0 8px; }
dt { font-weight: 700; } dd { margin: 0; font-family: "IBM Plex Mono", monospace; }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: .85rem; padding-top: 32px; padding-bottom: 48px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>位数 2・3・4 のモノイド</h1>
  <p class="lead">
    同型を除いて、位数 2 のモノイドは 2 個、位数 3 は 7 個、位数 4 は 35 個あります。
    単位元を <b>e</b> とし、残りの元を a, b, c としたケイリー表（行 × 列 = 積）で全て列挙しています。
    一覧はページを開いたときにブラウザ上で全ての結合的な演算表を探索して生成しています。
  </p>
  <nav id="orders"></nav>
  <div class="filters" id="filters"></div>
</header>
<main id="main"></main>
<footer>
  参考: OEIS <a href="https://oeis.org/A058129">A058129</a>（同型類の数 1, 2, 7, 35, 228, …）。
  「双対」は演算を左右反転させた (x·y ↦ y·x) モノイドの番号です。
</footer>
<script type="module">
import { enumerateMonoids } from "./monoids.js";

const NAMES = ["e", "a", "b", "c"];
const ORDERS = [2, 3, 4];
const data = Object.fromEntries(ORDERS.map((n) => [n, enumerateMonoids(n)]));

const FILTERS = [
  ["isGroup", "群"],
  ["commutative", "可換"],
  ["nonCommutative", "非可換"],
  ["isBand", "冪等"],
  ["hasZero", "零元あり"],
];
const state = { orders: new Set(ORDERS), filters: new Set() };

const nav = document.getElementById("orders");
for (const n of ORDERS) {
  const b = document.createElement("button");
  b.textContent = `位数 ${n}（${data[n].length}）`;
  b.setAttribute("aria-pressed", "true");
  b.onclick = () => {
    state.orders.has(n) ? state.orders.delete(n) : state.orders.add(n);
    b.setAttribute("aria-pressed", String(state.orders.has(n)));
    render();
  };
  nav.append(b);
}
const filters = document.getElementById("filters");
for (const [key, label] of FILTERS) {
  const l = document.createElement("label");
  const c = document.createElement("input");
  c.type = "checkbox";
  c.onchange = () => {
    c.checked ? state.filters.add(key) : state.filters.delete(key);
    render();
  };
  l.append(c, label);
  filters.append(l);
}

const test = {
  isGroup: (m) => m.isGroup,
  commutative: (m) => m.commutative,
  nonCommutative: (m) => !m.commutative,
  isBand: (m) => m.isBand,
  hasZero: (m) => m.zero !== undefined,
};

function cayley(m) {
  const n = m.n;
  const head = `<tr><th>·</th>${NAMES.slice(0, n).map((x) => `<th>${x}</th>`).join("")}</tr>`;
  const rows = [...Array(n).keys()].map((x) =>
    `<tr><th>${NAMES[x]}</th>${[...Array(n).keys()].map((y) => {
      const v = m.table[x * n + y];
      return `<td class="v${v}">${NAMES[v]}</td>`;
    }).join("")}</tr>`).join("");
  return `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

const set = (xs) => `{${xs.map((x) => NAMES[x]).join(", ")}}`;

function card(m) {
  return `<article class="card">
    <h3><b>M<sub>${m.n}</sub>-${m.index}</b><span>${m.selfDual ? "" : `双対: M<sub>${m.n}</sub>-${m.dualIndex}`}</span></h3>
    ${cayley(m)}
    <div class="tags">${m.tags.map((t) => `<span class="tag${t === "群" ? " g" : ""}">${t}</span>`).join("")}</div>
    <dl>
      <dt>冪等元</dt><dd>${set(m.idempotents)}</dd>
      <dt>単元群</dt><dd>${set(m.units)}</dd>
      <dt>零元</dt><dd>${m.zero === undefined ? "なし" : NAMES[m.zero]}</dd>
    </dl>
  </article>`;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = ORDERS.filter((n) => state.orders.has(n)).map((n) => {
    const list = data[n].filter((m) => [...state.filters].every((f) => test[f](m)));
    return `<section><h2>位数 ${n}<small>${list.length} / ${data[n].length} 個</small></h2>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">条件に合うモノイドはありません。</p>`}
    </section>`;
  }).join("");
}
render();
</script>
</body>
</html>
