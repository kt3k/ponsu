<head>

}

.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
section h2 { font-size: 1.3rem; margin: 32px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
section h2 small { color: var(--muted); font-weight: 400; font-size: .9rem; margin-left: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }

dt { font-weight: 700; } dd { margin: 0; font-family: "IBM Plex Mono", monospace; }

.cg .node.on { stroke: var(--ink); stroke-width: 3; }
.cg .node.on.v0 { fill: var(--c0); } .cg .node.on.v1 { fill: var(--c1); } .cg .node.on.v2 { fill: var(--c2); }
.cg .node.on.v3 { fill: var(--c3); } .cg .node.on.v4 { fill: var(--c4); } .cg .node.on.v5 { fill: var(--c5); }

<script type="module">
// __BUILD__ is replaced with the commit SHA on deploy so browsers never mix cached and fresh files.
import { analyze, greenStructure, minimalGenerators, tags } from "./monoids.js?v=__BUILD__";

const NAMES = ["e", "a", "b", "c", "d", "f"];
const PAGE = 48;
// Generated by scripts/generate.js: { n: [{ t: table, dual: index, names?: [...] }] }
const raw = await fetch("./data.json?v=__BUILD__").then((r) => r.json());
const ORDERS = Object.keys(raw).map(Number);
const data = Object.fromEntries(ORDERS.map((n) => [n, raw[n].map((e, i) => {
  const table = [...e.t].map(Number);
  const m = { n, index: i + 1, table, names: e.names ?? [], dualIndex: e.dual + 1, selfDual: e.dual === i, ...analyze(table, n) };
  m.tags = tags(m);
  return m;
})]));

      塗られたマスは群になっている ℋ 類、下線付きの元は冪等元で、上にある箱ほどイデアルが大きく、線は 𝒥 順序の被覆関係です。`,

    footer: `See OEIS <a href="https://oeis.org/A058129">A058129</a> (number of isomorphism classes: 1, 2, 7, 35, 228, 2237, …).

      Notation: Zₙ cyclic group, Cₙ chain (semilattice), Lₖ / Rₖ left / right zero semigroup (x·y = x / y), Oₖ null semigroup (all products 0),
      S¹ adjoin an identity, S⁰ adjoin a zero, ⟨g | gⁱ⁺ᵖ = gⁱ⟩ monogenic monoid, T₂ full transformation monoid on 2 points,
      B₂ Brandt semigroup, A₂ the 5-element Rees 0-matrix semigroup.
      Transformations multiply as x·y = "x, then y" (a right action), matching the switches.<br>
      Cayley graph: an arrow s → s·g for each generator g of a smallest generating set, i.e. the switch's state diagram (self-loops drawn as small rings).<br>
      Egg-box diagram: thick boxes are 𝒟-classes (= 𝒥-classes), rows are ℛ-classes (equal xM), columns are ℒ-classes (equal Mx) and cells are ℋ-classes.
      Shaded cells are group ℋ-classes, underlined elements are idempotents, higher boxes have larger ideals, and lines are covers in the 𝒥-order.`,

function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q in I18N) return q;
  try {
    const saved = localStorage.getItem("lang");
    if (saved in I18N) return saved;
  } catch {}
  return (navigator.language || "").startsWith("ja") ? "ja" : "en";
}

const FILTER_KEYS = ["isGroup", "commutative", "isBand", "hasZero", "cyclic", "inverse", "named"];
// filters: key -> true (must have) / false (must not have); absent = any
// shown: order -> number of cards currently rendered in that section
const VIEW_KEYS = ["table", "graph", "egg"];
const state = { lang: initialLang(), orders: new Set(ORDERS), filters: new Map(), shown: new Map(), views: new Set(VIEW_KEYS) };
const t = () => I18N[state.lang];

const test = {
  isGroup: (m) => m.isGroup,
  commutative: (m) => m.commutative,
  isBand: (m) => m.isBand,
  hasZero: (m) => m.zero !== undefined,
  cyclic: (m) => m.cyclic,
  inverse: (m) => m.inverse,
  named: (m) => m.names.length > 0,
};

function renderControls() {
  const lang = document.getElementById("lang");
  lang.replaceChildren(...Object.entries({ ja: "日本語", en: "English" }).map(([code, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", String(state.lang === code));
    b.onclick = () => {
      state.lang = code;
      try { localStorage.setItem("lang", code); } catch {}
      renderAll();
    };
    return b;
  }));

  const nav = document.getElementById("orders");
  nav.replaceChildren(...ORDERS.map((n) => {
    const b = document.createElement("button");
    b.textContent = t().orderButton(n, data[n].length);
    b.setAttribute("aria-pressed", String(state.orders.has(n)));
    b.onclick = () => {
      state.orders.has(n) ? state.orders.delete(n) : state.orders.add(n);
      renderAll();
    };
    return b;
  }));

  const filters = document.getElementById("filters");
  filters.replaceChildren(...FILTER_KEYS.map((key) => {
    const [yes, no] = t().filters[key];
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.append(...[[undefined, t().any], [true, yes], [false, no]].map(([value, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(state.filters.get(key) === value));
      b.onclick = () => {
        value === undefined ? state.filters.delete(key) : state.filters.set(key, value);
        state.shown.clear();
        renderControls();
        render();
      };
      return b;
    }));
    return seg;
  }));

  const views = document.getElementById("views");
  views.replaceChildren(t().viewsLabel, ...VIEW_KEYS.map((key) => {
    const seg = document.createElement("div");
    seg.className = "seg";
    const b = document.createElement("button");
    b.textContent = t().views[key];
    b.setAttribute("aria-pressed", String(state.views.has(key)));
    b.onclick = () => {
      state.views.has(key) ? state.views.delete(key) : state.views.add(key);
      renderControls();
      render();
    };
    seg.append(b);
    return seg;
  }));
}

// Per-card switch state: id -> { state, presses, last }
const switches = new Map();
const swOf = (m) => switches.get(`${m.n}-${m.index}`) ?? { state: 0, presses: [], last: null };

function cayley(m, sw) {
  const n = m.n;
  const head = `<tr><th>·</th>${NAMES.slice(0, n).map((x) => `<th>${x}</th>`).join("")}</tr>`;
  const rows = [...Array(n).keys()].map((x) =>
    `<tr${sw.last && sw.last.from === x ? ' class="cur"' : ""}><th>${NAMES[x]}</th>${[...Array(n).keys()].map((y) => {
      const v = m.table[x * n + y];
      const hit = sw.last && sw.last.from === x && sw.last.button === y;
      return `<td class="v${v}${hit ? " hit" : ""}">${NAMES[v]}</td>`;
    }).join("")}</tr>`).join("");
  return `<table${n > 4 ? ' class="big"' : ""}><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

// Cayley graph: elements on a circle, arrows s → s·g for each generator g
function cayleyGraph(m, sw) {
  const L = t();
  const n = m.n;
  m.gens ??= minimalGenerators(m.table, n);
  const size = 200, c = size / 2, R = 68, r = 13;
  const pos = [...Array(n).keys()].map((i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
    return [c + R * Math.cos(a), c + R * Math.sin(a)];
  });
  const id = `${m.n}-${m.index}`;
  const markers = m.gens.map((g) =>
    `<marker id="ar-${id}-${g}" class="g${g}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>`).join("");
  const edges = [];
  for (let s = 0; s < n; s++)
    m.gens.forEach((g, gi) => {
      const to = m.table[s * n + g];
      const hot = sw.last && sw.last.from === s && sw.last.button === g ? " hot" : "";
      const [x1, y1] = pos[s];
      if (to === s) {
        // self-loop: a small ring just outside the node, fanned out per generator
        const a = Math.atan2(y1 - c, x1 - c) + (gi - (m.gens.length - 1) / 2) * 0.7;
        const lx = x1 + (r + 6) * Math.cos(a), ly = y1 + (r + 6) * Math.sin(a);
        edges.push(`<circle class="edge g${g}${hot}" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="6"/>`);
        return;
      }
      const [x2, y2] = pos[to];
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      // bend to the right of the direction of travel, more for each further generator
      const off = 10 + gi * 9;
      const qx = (x1 + x2) / 2 + (dy / len) * off, qy = (y1 + y2) / 2 - (dx / len) * off;
      const trim = (px, py, ax, ay, d) => {
        const l = Math.hypot(ax - px, ay - py);
        return [px + ((ax - px) / l) * d, py + ((ay - py) / l) * d];
      };
      const [sx, sy] = trim(x1, y1, qx, qy, r + 1);
      const [ex, ey] = trim(x2, y2, qx, qy, r + 2);
      edges.push(`<path class="edge g${g}${hot}" d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" marker-end="url(#ar-${id}-${g})"/>`);
    });
  const nodes = pos.map(([x, y], i) =>
    `<circle class="node v${i}${i === sw.state ? " on" : ""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/><text x="${x.toFixed(1)}" y="${(y + 4.5).toFixed(1)}" text-anchor="middle" font-size="13">${NAMES[i]}</text>`).join("");
  const gens = m.gens.map((g) => `<b class="g${g}">${NAMES[g]}</b>`).join(", ");
  return `<div class="fig"><div class="fig-label gens">${L.graphLabel}: ${gens})</div>
    <svg class="cg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><defs>${markers}</defs>${edges.join("")}${nodes}</svg></div>`;
}

// Egg-box diagram of Green's relations, D-classes layered by the J-order
function eggBox(m) {
  const L = t();
  m.green ??= greenStructure(m.table, m.n);
  const { classes, covers, layer } = m.green;
  const rowH = 22, gapX = 14, gapY = 24;
  const boxes = classes.map((d) => {
    const maxLen = Math.max(...d.cells.flat().map((h) => h.length));
    const cw = Math.max(22, maxLen * 9 + 10);
    return { d, cw, w: d.cells[0].length * cw, h: d.cells.length * rowH };
  });
  const layers = [];
  boxes.forEach((b, i) => (layers[layer[i]] ??= []).push(i));
  const width = Math.max(...layers.map((ls) => ls.reduce((s, i) => s + boxes[i].w, 0) + gapX * (ls.length - 1)));
  let y = 2;
  for (const ls of layers) {
    const total = ls.reduce((s, i) => s + boxes[i].w, 0) + gapX * (ls.length - 1);
    let x = (width - total) / 2 + 2;
    for (const i of ls) {
      Object.assign(boxes[i], { x, y });
      x += boxes[i].w + gapX;
    }
    y += Math.max(...ls.map((i) => boxes[i].h)) + gapY;
  }
  const height = y - gapY + 4;
  const lines = covers.map(([a, b]) => {
    const A = boxes[a], B = boxes[b];
    return `<line class="cover" x1="${A.x + A.w / 2}" y1="${A.y + A.h}" x2="${B.x + B.w / 2}" y2="${B.y}"/>`;
  }).join("");
  const cells = boxes.map(({ d, cw, x, y, w, h }) => {
    const inner = d.cells.map((row, ri) => row.map((hc, ci) => {
      const cx = x + ci * cw, cy = y + ri * rowH;
      const label = hc.map((e) => `<tspan${d.idempotents.includes(e) ? ' class="idem"' : ""}>${NAMES[e]}</tspan>`).join("");
      return `<rect class="cell${d.group[ri][ci] ? " grp" : ""}" x="${cx}" y="${cy}" width="${cw}" height="${rowH}"/>
        <text x="${cx + cw / 2}" y="${cy + 15}" text-anchor="middle" font-size="12">${label}</text>`;
    }).join("")).join("");
    return `${inner}<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  }).join("");
  return `<div class="fig"><div class="fig-label">${L.eggLabel}</div>
    <svg class="egg" viewBox="0 0 ${width + 4} ${height}" width="${width + 4}" height="${height}">${lines}${cells}</svg></div>`;
}

const set = (xs) => `{${xs.map((x) => NAMES[x]).join(", ")}}`;

function switchPanel(m, sw) {
  const L = t();
  const els = [...Array(m.n).keys()];
  const shown = sw.presses.length > 16 ? ["…", ...sw.presses.slice(-16).map((x) => NAMES[x])] : sw.presses.map((x) => NAMES[x]);
  return `<div class="switch">
    <div class="switch-label">${L.switchLabel}</div>
    <div class="lamps${m.n > 4 ? " big-lamps" : ""}">${els.map((x) => `<span class="lamp v${x}${x === sw.state ? " on" : ""}">${NAMES[x]}</span>`).join("")}</div>
    <div class="btns${m.n > 4 ? " big-btns" : ""}">${els.slice(1).map((x) => `<button data-press="${x}">${NAMES[x]}</button>`).join("")}<button class="reset" data-reset title="${L.reset}" aria-label="${L.reset}">↺</button></div>
    <div class="hist">${sw.presses.length ? `e·${shown.join("·")} = <b>${NAMES[sw.state]}</b>` : "e"}</div>
  </div>`;
}

function card(m) {
  const L = t();
  const sw = swOf(m);
  return `<article class="card" data-id="${m.n}-${m.index}">
    <h3><b>M<sub>${m.n}</sub>-${m.index}</b><span>${m.selfDual ? "" : `${L.dual}: M<sub>${m.n}</sub>-${m.dualIndex}`}</span></h3>
    ${m.names.length ? `<p class="names">${m.names.join("<br>")}</p>` : ""}
    ${state.views.has("table") ? cayley(m, sw) : ""}
    ${state.views.has("graph") ? cayleyGraph(m, sw) : ""}
    ${state.views.has("egg") ? eggBox(m) : ""}
    <div class="tags">${m.tags.map((tag) => `<span class="tag${tag === "group" ? " g" : ""}">${L.tags[tag]}</span>`).join("")}</div>
    <dl>
      <dt>${L.idempotents}</dt><dd>${set(m.idempotents)}</dd>
      <dt>${L.units}</dt><dd>${set(m.units)}</dd>
      <dt>${L.zero}</dt><dd>${m.zero === undefined ? L.none : NAMES[m.zero]}</dd>
    </dl>
    ${switchPanel(m, sw)}
  </article>`;
}

function render() {
  const L = t();
  document.getElementById("main").innerHTML = ORDERS.filter((n) => state.orders.has(n)).map((n) => {
    const list = data[n].filter((m) => [...state.filters].every(([f, want]) => test[f](m) === want));
    const shown = state.shown.get(n) ?? PAGE;
    const rest = list.length - shown;
    return `<section><h2>${L.order(n)}<small>${L.count(list.length, data[n].length)}</small></h2>
      ${list.length ? `<div class="grid">${list.slice(0, shown).map(card).join("")}</div>` : `<p class="empty">${L.empty}</p>`}
      ${rest > 0 ? `<button class="more" data-more="${n}">${L.more(rest)}</button>` : ""}
    </section>`;
  }).join("");
}

function renderAll() {
  const L = t();
  document.documentElement.lang = state.lang;
  document.title = L.docTitle;
  document.getElementById("title").textContent = L.title;
  document.getElementById("lead").innerHTML = L.lead;
  document.getElementById("footer").innerHTML = L.footer;
  renderControls();
  render();
}
document.getElementById("main").addEventListener("click", (ev) => {
  const more = ev.target.closest("button[data-more]");
  if (more) {
    const n = Number(more.dataset.more);
    state.shown.set(n, (state.shown.get(n) ?? PAGE) + PAGE);
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    return;
  }
  const btn = ev.target.closest("button[data-press], button[data-reset]");
  if (!btn) return;
  const el = btn.closest(".card");
  const [n, index] = el.dataset.id.split("-").map(Number);
  const m = data[n][index - 1];
  const sw = swOf(m);
  if (btn.hasAttribute("data-reset")) {
    switches.delete(el.dataset.id);
  } else {
    const x = Number(btn.dataset.press);
    const next = m.table[sw.state * n + x];
    switches.set(el.dataset.id, { state: next, presses: [...sw.presses, x], last: { from: sw.state, button: x } });
  }
  el.outerHTML = card(m);
});

renderAll();
</script>
</body>
