<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>位数 2・3・4 のモノイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e2ddd3;
  --accent: #b4432c;
  --c0: #f1efe9; --c1: #f6c9a8; --c2: #a8d5c2; --c3: #b9c4ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513; --card: #201f1c; --ink: #ece8e0; --muted: #a29c90; --line: #35332e;
    --accent: #ec8a6f;
    --c0: #2a2925; --c1: #6b4128; --c2: #275545; --c3: #343f6e;
  }
}
* { box-sizing: border-box; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.6; }
header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 48px; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 8px; letter-spacing: .02em; }
.lead { color: var(--muted); margin: 0 0 24px; max-width: 46em; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
nav button, .lang button {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.lang { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 16px; }
.lang button { font-size: .85rem; padding: 4px 12px; }
nav button[aria-pressed="true"], .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; font-size: .85rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.seg button { font: inherit; border: 0; background: none; color: var(--muted); padding: 4px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
section h2 { font-size: 1.3rem; margin: 32px 0 4px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
section h2 small { color: var(--muted); font-weight: 400; font-size: .9rem; margin-left: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card h3 { margin: 0 0 8px; font-size: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
.names { margin: -4px 0 8px; font-size: .85rem; line-height: 1.4; }
.card h3 > span { color: var(--muted); font-weight: 400; font-size: .8rem; }
table { border-collapse: collapse; font-family: "IBM Plex Mono", ui-monospace, monospace; margin: 0 auto 10px; }
td, th { width: 2.1em; height: 2.1em; text-align: center; font-size: .95rem; }
th { color: var(--muted); font-weight: 500; }
thead th { border-bottom: 1px solid var(--muted); }
tbody th { border-right: 1px solid var(--muted); }
td.v0 { background: var(--c0); } td.v1 { background: var(--c1); }
td.v2 { background: var(--c2); } td.v3 { background: var(--c3); }
tr.cur th { color: var(--ink); font-weight: 700; }
td.hit { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.switch { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
.switch-label { font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
.lamps { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.lamp {
  width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center;
  font-family: "IBM Plex Mono", monospace; border: 2px solid var(--line); color: var(--muted);
  transition: background .15s, border-color .15s, transform .15s;
}
.lamp.on { border-color: var(--ink); color: var(--ink); transform: scale(1.12); font-weight: 700; }
.lamp.on.v0 { background: var(--c0); } .lamp.on.v1 { background: var(--c1); }
.lamp.on.v2 { background: var(--c2); } .lamp.on.v3 { background: var(--c3); }
.btns { display: flex; gap: 6px; justify-content: center; }
.btns button {
  font: 500 .95rem "IBM Plex Mono", monospace; min-width: 2.6em; padding: 6px 10px; cursor: pointer;
  border: 1px solid var(--ink); border-radius: 6px; background: var(--card); color: var(--ink);
}
.btns button:active { transform: translateY(1px); }
.btns button.reset { border-color: var(--line); color: var(--muted); }
.hist { font-family: "IBM Plex Mono", monospace; font-size: .78rem; color: var(--muted); text-align: center; margin-top: 6px; min-height: 1.4em; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.tag { font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
.tag.g { border-color: var(--accent); color: var(--accent); }
dl { margin: 0; font-size: .78rem; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 0 8px; }
dt { font-weight: 700; } dd { margin: 0; font-family: "IBM Plex Mono", monospace; }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: .85rem; padding-top: 32px; padding-bottom: 48px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="lang" id="lang"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <nav id="orders"></nav>
  <div class="filters" id="filters"></div>
</header>
<main id="main"></main>
<footer id="footer"></footer>
<script type="module">
import { enumerateMonoids } from "./monoids.js";

const NAMES = ["e", "a", "b", "c"];
const ORDERS = [2, 3, 4];
const data = Object.fromEntries(ORDERS.map((n) => [n, enumerateMonoids(n)]));

const I18N = {
  ja: {
    docTitle: "位数 2・3・4 のモノイド",
    title: "位数 2・3・4 のモノイド",
    lead: `同型を除いて、位数 2 のモノイドは 2 個、位数 3 は 7 個、位数 4 は 35 個あります。
      単位元を <b>e</b> とし、残りの元を a, b, c としたケイリー表（行 × 列 = 積）で全て列挙しています。
      一覧はページを開いたときにブラウザ上で全ての結合的な演算表を探索して生成しています。
      各カードのスイッチは、状態 s でボタン x を押すと状態が s·x に変わる「N 状態・N−1 ボタン」の機械です（右正則表現）。
      e から始めてボタンを押した列の積が、そのまま今の状態になります。`,
    order: (n) => `位数 ${n}`,
    orderButton: (n, k) => `位数 ${n}（${k}）`,
    count: (k, total) => `${k} / ${total} 個`,
    empty: "条件に合うモノイドはありません。",
    dual: "双対",
    switchLabel: "スイッチ（状態 s でボタン x → s·x）",
    reset: "リセット",
    idempotents: "冪等元",
    units: "単元群",
    zero: "零元",
    none: "なし",
    any: "すべて",
    filters: {
      isGroup: ["群", "群でない"],
      commutative: ["可換", "非可換"],
      isBand: ["冪等", "冪等でない"],
      hasZero: ["零元あり", "零元なし"],
    },
    tags: { group: "群", commutative: "可換", band: "冪等 (band)", zero: "零元あり", cyclic: "単生成", leftCancel: "左簡約", rightCancel: "右簡約", selfDual: "自己双対" },
    footer: `参考: OEIS <a href="https://oeis.org/A058129">A058129</a>（同型類の数 1, 2, 7, 35, 228, …）。
      「双対」は演算を左右反転させた (x·y ↦ y·x) モノイドの番号です。<br>
      記法: Zₙ 巡回群、Cₙ 鎖（半束）、Lₖ / Rₖ 左 / 右零半群（x·y = x / y）、Oₖ 零半群（全ての積が 0）、
      S¹ 単位元を添加、S⁰ 零元を添加、⟨g | gⁱ⁺ᵖ = gⁱ⟩ 単生成モノイド。`,
  },
  en: {
    docTitle: "Monoids of Order 2, 3, 4",
    title: "Monoids of order 2, 3 and 4",
    lead: `Up to isomorphism there are 2 monoids of order 2, 7 of order 3 and 35 of order 4.
      Each one is shown as a Cayley table (row × column = product) with identity <b>e</b> and other elements a, b, c.
      The list is generated in your browser on page load by searching every associative operation table.
      The switch on each card is an N-state machine with N−1 buttons: pressing x in state s moves it to s·x (the right regular representation).
      Starting from e, the current state is always the product of the buttons pressed so far.`,
    order: (n) => `Order ${n}`,
    orderButton: (n, k) => `Order ${n} (${k})`,
    count: (k, total) => `${k} / ${total}`,
    empty: "No monoids match the selected filters.",
    dual: "Dual",
    switchLabel: "Switch (button x in state s → s·x)",
    reset: "Reset",
    idempotents: "Idempotents",
    units: "Units",
    zero: "Zero",
    none: "none",
    any: "Any",
    filters: {
      isGroup: ["Group", "Not a group"],
      commutative: ["Commutative", "Non-commutative"],
      isBand: ["Band", "Not a band"],
      hasZero: ["Has zero", "No zero"],
    },
    tags: { group: "group", commutative: "commutative", band: "band", zero: "has zero", cyclic: "monogenic", leftCancel: "left cancellative", rightCancel: "right cancellative", selfDual: "self-dual" },
    footer: `See OEIS <a href="https://oeis.org/A058129">A058129</a> (number of isomorphism classes: 1, 2, 7, 35, 228, …).
      "Dual" is the number of the monoid with the operation reversed (x·y ↦ y·x).<br>
      Notation: Zₙ cyclic group, Cₙ chain (semilattice), Lₖ / Rₖ left / right zero semigroup (x·y = x / y), Oₖ null semigroup (all products 0),
      S¹ adjoin an identity, S⁰ adjoin a zero, ⟨g | gⁱ⁺ᵖ = gⁱ⟩ monogenic monoid.`,
  },
};

function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q in I18N) return q;
  try {
    const saved = localStorage.getItem("lang");
    if (saved in I18N) return saved;
  } catch {}
  return (navigator.language || "").startsWith("ja") ? "ja" : "en";
}

const FILTER_KEYS = ["isGroup", "commutative", "isBand", "hasZero"];
// filters: key -> true (must have) / false (must not have); absent = any
const state = { lang: initialLang(), orders: new Set(ORDERS), filters: new Map() };
const t = () => I18N[state.lang];

const test = {
  isGroup: (m) => m.isGroup,
  commutative: (m) => m.commutative,
  isBand: (m) => m.isBand,
  hasZero: (m) => m.zero !== undefined,
};

function renderControls() {
  const lang = document.getElementById("lang");
  lang.replaceChildren(...Object.entries({ ja: "日本語", en: "English" }).map(([code, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.setAttribute("aria-pressed", String(state.lang === code));
    b.onclick = () => {
      state.lang = code;
      try { localStorage.setItem("lang", code); } catch {}
      renderAll();
    };
    return b;
  }));

  const nav = document.getElementById("orders");
  nav.replaceChildren(...ORDERS.map((n) => {
    const b = document.createElement("button");
    b.textContent = t().orderButton(n, data[n].length);
    b.setAttribute("aria-pressed", String(state.orders.has(n)));
    b.onclick = () => {
      state.orders.has(n) ? state.orders.delete(n) : state.orders.add(n);
      renderAll();
    };
    return b;
  }));

  const filters = document.getElementById("filters");
  filters.replaceChildren(...FILTER_KEYS.map((key) => {
    const [yes, no] = t().filters[key];
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.append(...[[undefined, t().any], [true, yes], [false, no]].map(([value, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(state.filters.get(key) === value));
      b.onclick = () => {
        value === undefined ? state.filters.delete(key) : state.filters.set(key, value);
        renderControls();
        render();
      };
      return b;
    }));
    return seg;
  }));
}

// Per-card switch state: id -> { state, presses, last }
const switches = new Map();
const swOf = (m) => switches.get(`${m.n}-${m.index}`) ?? { state: 0, presses: [], last: null };

function cayley(m, sw) {
  const n = m.n;
  const head = `<tr><th>·</th>${NAMES.slice(0, n).map((x) => `<th>${x}</th>`).join("")}</tr>`;
  const rows = [...Array(n).keys()].map((x) =>
    `<tr${sw.last && sw.last.from === x ? ' class="cur"' : ""}><th>${NAMES[x]}</th>${[...Array(n).keys()].map((y) => {
      const v = m.table[x * n + y];
      const hit = sw.last && sw.last.from === x && sw.last.button === y;
      return `<td class="v${v}${hit ? " hit" : ""}">${NAMES[v]}</td>`;
    }).join("")}</tr>`).join("");
  return `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

const set = (xs) => `{${xs.map((x) => NAMES[x]).join(", ")}}`;

function switchPanel(m, sw) {
  const L = t();
  const els = [...Array(m.n).keys()];
  const shown = sw.presses.length > 16 ? ["…", ...sw.presses.slice(-16).map((x) => NAMES[x])] : sw.presses.map((x) => NAMES[x]);
  return `<div class="switch">
    <div class="switch-label">${L.switchLabel}</div>
    <div class="lamps">${els.map((x) => `<span class="lamp v${x}${x === sw.state ? " on" : ""}">${NAMES[x]}</span>`).join("")}</div>
    <div class="btns">${els.slice(1).map((x) => `<button data-press="${x}">${NAMES[x]}</button>`).join("")}<button class="reset" data-reset title="${L.reset}" aria-label="${L.reset}">↺</button></div>
    <div class="hist">${sw.presses.length ? `e·${shown.join("·")} = <b>${NAMES[sw.state]}</b>` : "e"}</div>
  </div>`;
}

function card(m) {
  const L = t();
  const sw = swOf(m);
  return `<article class="card" data-id="${m.n}-${m.index}">
    <h3><b>M<sub>${m.n}</sub>-${m.index}</b><span>${m.selfDual ? "" : `${L.dual}: M<sub>${m.n}</sub>-${m.dualIndex}`}</span></h3>
    ${m.names.length ? `<p class="names">${m.names.join("<br>")}</p>` : ""}
    ${cayley(m, sw)}
    <div class="tags">${m.tags.map((tag) => `<span class="tag${tag === "group" ? " g" : ""}">${L.tags[tag]}</span>`).join("")}</div>
    <dl>
      <dt>${L.idempotents}</dt><dd>${set(m.idempotents)}</dd>
      <dt>${L.units}</dt><dd>${set(m.units)}</dd>
      <dt>${L.zero}</dt><dd>${m.zero === undefined ? L.none : NAMES[m.zero]}</dd>
    </dl>
    ${switchPanel(m, sw)}
  </article>`;
}

function render() {
  const L = t();
  document.getElementById("main").innerHTML = ORDERS.filter((n) => state.orders.has(n)).map((n) => {
    const list = data[n].filter((m) => [...state.filters].every(([f, want]) => test[f](m) === want));
    return `<section><h2>${L.order(n)}<small>${L.count(list.length, data[n].length)}</small></h2>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">${L.empty}</p>`}
    </section>`;
  }).join("");
}

function renderAll() {
  const L = t();
  document.documentElement.lang = state.lang;
  document.title = L.docTitle;
  document.getElementById("title").textContent = L.title;
  document.getElementById("lead").innerHTML = L.lead;
  document.getElementById("footer").innerHTML = L.footer;
  renderControls();
  render();
}
document.getElementById("main").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-press], button[data-reset]");
  if (!btn) return;
  const el = btn.closest(".card");
  const [n, index] = el.dataset.id.split("-").map(Number);
  const m = data[n][index - 1];
  const sw = swOf(m);
  if (btn.hasAttribute("data-reset")) {
    switches.delete(el.dataset.id);
  } else {
    const x = Number(btn.dataset.press);
    const next = m.table[sw.state * n + x];
    switches.set(el.dataset.id, { state: next, presses: [...sw.presses, x], last: { from: sw.state, button: x } });
  }
  el.outerHTML = card(m);
});

renderAll();
</script>
</body>
</html>
